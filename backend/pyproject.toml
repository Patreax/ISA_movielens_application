[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys_api"
version = "0.1.0"
description = "ISA MovieLens recommendation REST API backend (FastAPI, pretrained SVD + cold-start KMeans)."
requires-python = ">=3.11,<3.13"
readme = "README.md"
authors = [{ name = "Patrik Tomco", email = "xtomco@stuba.sk" }, { name = "Samuel Svitek", email = "xsvitek@stuba.sk" }]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
